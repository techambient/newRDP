name: Chrome Remote Desktop RDP

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Paste your entire Chrome Remote Desktop Windows (cmd.exe) string here'
        required: true
      pin_code:
        description: 'Set a temporary 6-digit access PIN'
        required: true
        default: '123456'

jobs:
  crd-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Install Chrome Remote Desktop via Chocolatey
        shell: powershell
        run: |
          Write-Host "Deploying Chrome Remote Desktop Host using Chocolatey..."
          # choco handles headless automation, privilege allocation, and dependencies cleanly
          choco install chrome-remote-desktop -y --no-progress
          
          Write-Host "Deployment completed. Pausing 15 seconds to ensure host services stabilize..."
          Start-Sleep -Seconds 15

      - name: Configure and Start CRD Session
        shell: powershell
        run: |
          $rawInput = @'
          ${{ github.event.inputs.auth_code }}
          '@.Trim()
          
          $pin = "${{ github.event.inputs.pin_code }}"
          
          # Dynamically trace the location of the installed executable target
          $searchPaths = @(
              "C:\Program Files\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe",
              "C:\Program Files (x86)\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe",
              "C:\Program Files\Google\Chrome Remote Desktop\*\remoting_start_host.exe",
              "C:\Program Files (x86)\Google\Chrome Remote Desktop\*\remoting_start_host.exe"
          )
          
          $exePath = $null
          foreach ($path in $searchPaths) {
              $resolved = Resolve-Path $path -ErrorAction SilentlyContinue
              if ($resolved) {
                  $exePath = $resolved.Path
                  break
              }
          }
          
          if (-not $exePath) {
              Write-Error "CRD executable could not be located in standard file system paths!"
              exit 1
          }
          
          Write-Host "Target located at: $exePath"
          
          # Isolate parameters cleanly from your command input line string
          $codeParam = ""
          $redirectParam = "https://google.com"
          
          if ($rawInput -match '--code="([^"]+)"') { $codeParam = $Matches[1] }
          elseif ($rawInput -match '--code=([^ ]+)') { $codeParam = $Matches[1].Trim('"') }
          
          if (-not $codeParam) {
              Write-Error "Failed to isolate valid authorization token values from your input text block."
              exit 1
          }
          
          $arguments = @(
              "--code=`"$codeParam`"",
              "--redirect-url=`"$redirectParam`"",
              "--name=`"$env:COMPUTERNAME`"",
              "--pin=`"$pin`""
          )
          
          Write-Host "Registering machine profile with Google services..."
          $process = Start-Process -FilePath $exePath -ArgumentList $arguments -NoNewWindow -PassThru -Wait
          
          if ($process.ExitCode -ne 0) {
              Write-Error "Google service host registration dropped out with error code: $($process.ExitCode)"
              exit 1
          }

      - name: Maintain Connection Loop
        shell: powershell
        run: |
          Write-Host "`n=================================================="
          Write-Host "     CHROME REMOTE DESKTOP SYSTEM ONLINE          "
          Write-Host "=================================================="
          Write-Host "Go to: https://remotedesktop.google.com/access"
          Write-Host "Your Device Access PIN is: ${{ github.event.inputs.pin_code }}"
          Write-Host "==================================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] Session Alive - Ready for connections via Google Web Dashboard"
              Start-Sleep -Seconds 300
          }
