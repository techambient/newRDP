name: Chrome Remote Desktop RDP

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Paste your entire Chrome Remote Desktop Windows (cmd.exe) string here'
        required: true
      pin_code:
        description: 'Set a temporary 6-digit access PIN'
        required: true
        default: '123456'

jobs:
  crd-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Force Install Official Chrome Remote Desktop
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          
          Write-Host "Downloading official Google Remote Desktop MSI package..."
          $msiUrl = "https://google.com"
          $installerPath = "$env:TEMP\crd.msi"
          Invoke-WebRequest -Uri $msiUrl -OutFile $installerPath
          
          Write-Host "Deploying official package natively with server bypass flags..."
          # CHROME_REMOTING_ALLOW_RERUN=1 completely bypasses the service installation hang on Windows Server
          $arguments = @("/i", "`"$installerPath`"", "/qn", "/norestart", "CHROME_REMOTING_ALLOW_RERUN=1", "ALLUSERS=1")
          $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          
          Write-Host "MSI Execution concluded with Exit Code: $($process.ExitCode)"
          Remove-Item $installerPath -Force
          
          Write-Host "Waiting 10 seconds for system paths to index..."
          Start-Sleep -Seconds 10

      - name: Authenticate and Register with Google Cloud
        shell: powershell
        env:
          RAW_INPUT: ${{ github.event.inputs.auth_code }}
        run: |
          $rawInput = $env:RAW_INPUT.Trim()
          $pin = "${{ github.event.inputs.pin_code }}"
          
          # Locate the true, officially installed Google executable path
          $exePath = "C:\Program Files\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $exePath)) {
              $exePath = "C:\Program Files (x86)\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          }
          
          if (-not (Test-Path $exePath)) {
              Write-Error "Critical Error: Official installation folder structure was rejected by the OS."
              exit 1
          }
          
          Write-Host "Official engine isolated at: $exePath"
          
          # Safely break out the exact command tokens using string parsing rules
          $codeParam = ""
          $redirectParam = "https://google.com"
          
          if ($rawInput -match '--code="([^"]+)"') { $codeParam = $Matches[1] }
          elseif ($rawInput -match '--code=([^ ]+)') { $codeParam = $Matches[1].Trim('"').Trim("'") }
          
          if (-not $codeParam) {
              Write-Error "Failed to parse token details from the input string."
              exit 1
          }
          
          # Format clean argument strings to invoke registration natively
          $arguments = @(
              "--code=`"$codeParam`"",
              "--redirect-url=`"$redirectParam`"",
              "--name=`"$env:COMPUTERNAME`"",
              "--pin=`"$pin`""
          )
          
          Write-Host "Sending native registration handshake signal to Google account..."
          $process = Start-Process -FilePath $exePath -ArgumentList $arguments -NoNewWindow -PassThru -Wait
          Write-Host "Registration engine closed with exit status: $($process.ExitCode)"

      - name: Maintain Connection Loop
        shell: powershell
        run: |
          Write-Host "`n=================================================="
          Write-Host "     CHROME REMOTE DESKTOP SYSTEM ONLINE          "
          Write-Host "=================================================="
          Write-Host "Go to: https://google.com"
          Write-Host "Your Device Access PIN is: ${{ github.event.inputs.pin_code }}"
          Write-Host "==================================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] Runner Active - Monitoring incoming web dashboard traffic..."
              Start-Sleep -Seconds 300
          }
