name: Chrome Remote Desktop RDP

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Paste your entire Chrome Remote Desktop Windows (cmd.exe) string here'
        required: true
      pin_code:
        description: 'Set a temporary 6-digit access PIN'
        required: true
        default: '123456'

jobs:
  crd-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Download and Install Chrome Remote Desktop
        shell: powershell
        run: |
          Write-Host "Downloading Google Remote Desktop installer..."
          # FIX: Restored the true, direct binary download URL
          $msiUrl = "https://dl.google.com/dl/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi"
          $installerPath = "$env:TEMP\crd.msi"
          
          Invoke-WebRequest -Uri $msiUrl -OutFile $installerPath
          
          Write-Host "Installing MSI silently..."
          # /qn performs a completely hidden, silent deployment
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/qn", "/norestart" -Wait
          
          Remove-Item $installerPath -Force
          Write-Host "Installation execution completed. Waiting 15 seconds for file registration..."
          Start-Sleep -Seconds 15

      - name: Configure and Start CRD Session
        shell: powershell
        run: |
          # Safely ingest the raw web authorization command string
          $rawInput = @'
          ${{ github.event.inputs.auth_code }}
          '@.Trim()
          
          $pin = "${{ github.event.inputs.pin_code }}"
          
          # Target the binary file directly via environment folder shortcuts
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $exePath = Join-Path $programFilesX86 "Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          
          # Verification safeguard to check installation health before moving forward
          if (-not (Test-Path $exePath)) {
              Write-Error "CRD executable could not be found at: $exePath. The background MSI installer may have failed."
              exit 1
          }
          
          # Use Regex tracking to break out token components safely from the raw input
          $codeParam = ""
          $redirectParam = ""
          
          if ($rawInput -match '--code="([^"]+)"') { $codeParam = $Matches[1] }
          if ($rawInput -match '--redirect-url="([^"]+)"') { $redirectParam = $Matches[1] }
          
          if (-not $codeParam) {
              Write-Error "Failed to parse authorization code token from your input text! Ensure it contains --code='...'"
              exit 1
          }
          
          # Rebuild clean parameter arrays to launch the executable
          $arguments = @(
              "--code=`"$codeParam`"",
              "--redirect-url=`"$redirectParam`"",
              "--name=`"$env:COMPUTERNAME`"",
              "--pin=`"$pin`""
          )
          
          Write-Host "Registering runner machine with Google using explicit parameters..."
          $process = Start-Process -FilePath $exePath -ArgumentList $arguments -NoNewWindow -PassThru -Wait
          
          if ($process.ExitCode -ne 0) {
              Write-Error "Host registration failed with exit code $($process.ExitCode)"
              exit 1
          }

      - name: Maintain Connection Loop
        shell: powershell
        run: |
          Write-Host "`n=================================================="
          Write-Host "     CHROME REMOTE DESKTOP SYSTEM ONLINE          "
          Write-Host "=================================================="
          Write-Host "Go to: https://remotedesktop.google.com/access"
          Write-Host "Your Device Access PIN is: ${{ github.event.inputs.pin_code }}"
          Write-Host "==================================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] Session Alive - Ready for connections via Google Web Dashboard"
              Start-Sleep -Seconds 300
          }
