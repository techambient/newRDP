name: Chrome Remote Desktop RDP

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Paste your entire Chrome Remote Desktop Windows (cmd.exe) string here'
        required: true
      pin_code:
        description: 'Set a temporary 6-digit access PIN'
        required: true
        default: '123456'

jobs:
  crd-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Administrative Extraction of Chrome Remote Desktop
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          
          Write-Host "Downloading Google's installation package..."
          $msiUrl = "https://google.com"
          $installerPath = "$env:TEMP\crd.msi"
          Invoke-WebRequest -Uri $msiUrl -OutFile $installerPath
          
          Write-Host "Performing administrative file extraction..."
          $extractDir = "C:\CRD_Target"
          
          # /a creates an administrative installation option, dumping the files cleanly without service lockups
          Start-Process msiexec.exe -ArgumentList "/a", "`"$installerPath`"", "/qn", "TARGETDIR=`"$extractDir`"" -Wait
          
          if (Test-Path $installerPath) { Remove-Item $installerPath -Force }
          
          Write-Host "Verifying extraction folder structure..."
          if (Test-Path $extractDir) {
              Get-ChildItem -Path $extractDir -Recurse -Filter "remoting_start_host.exe" -ErrorAction SilentlyContinue | Select-Object FullName
          }

      - name: Configure and Start CRD Session
        shell: powershell
        run: |
          $rawInput = @'
          ${{ github.event.inputs.auth_code }}
          '@.Trim()
          
          $pin = "${{ github.event.inputs.pin_code }}"
          
          # Scan our manual extraction target folder instead of default system folders
          $searchPaths = @(
              "C:\CRD_Target\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe",
              "C:\CRD_Target\Program Files\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe",
              "C:\CRD_Target\*\remoting_start_host.exe"
          )
          
          $exePath = $null
          foreach ($path in $searchPaths) {
              $resolved = Resolve-Path $path -ErrorAction SilentlyContinue
              if ($resolved) { $exePath = $resolved.Path; break }
          }
          
          if (-not $exePath) {
              Write-Error "CRD executable could not be mapped within extracted directories. Let's trace folder content:"
              Get-ChildItem -Path "C:\CRD_Target" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
              exit 1
          }
          
          Write-Host "Target engine isolated at: $exePath"
          
          # Safely isolate the auth code token parameter from your raw dashboard command string
          $codeParam = ""
          $redirectParam = "https://remotedesktop.google.com/_/oauthredirect"
          
          if ($rawInput -match '--code="([^"]+)"') { $codeParam = $Matches[1] }
          elseif ($rawInput -match '--code=([^ ]+)') { $codeParam = $Matches[1].Trim('"') }
          
          if (-not $codeParam) {
              Write-Error "Failed to parse authorization code token from your input text! Check layout string context."
              exit 1
          }
          
          $arguments = @(
              "--code=`"$codeParam`"",
              "--redirect-url=`"$redirectParam`"",
              "--name=`"$env:COMPUTERNAME`"",
              "--pin=`"$pin`""
          )
          
          Write-Host "Registering machine instance with Google infrastructure..."
          $process = Start-Process -FilePath $exePath -ArgumentList $arguments -NoNewWindow -PassThru -Wait
          
          if ($process.ExitCode -ne 0) {
              Write-Error "Google infrastructure authorization dropped out with error code: $($process.ExitCode)"
              exit 1
          }

      - name: Maintain Connection Loop
        shell: powershell
        run: |
          Write-Host "`n=================================================="
          Write-Host "     CHROME REMOTE DESKTOP SYSTEM ONLINE          "
          Write-Host "=================================================="
          Write-Host "Go to: https://google.com"
          Write-Host "Your Device Access PIN is: ${{ github.event.inputs.pin_code }}"
          Write-Host "==================================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Ready for connections via Google Web Dashboard"
              Start-Sleep -Seconds 300
          }
