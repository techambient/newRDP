name: Chrome Remote Desktop RDP

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Paste your entire Chrome Remote Desktop Windows (cmd.exe) string here'
        required: true
      pin_code:
        description: 'Set a temporary 6-digit access PIN'
        required: true
        default: '123456'

jobs:
  crd-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Deploy and Initialize Remote Host Engine
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          
          Write-Host "Creating secure directory footprint..."
          $targetDir = "C:\CRD_Service_Engine"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          
          Write-Host "Pulling structural binary payload..."
          $binUrl = "https://github.com"
          $exePath = Join-Path $targetDir "remoting_start_host.exe"
          Invoke-WebRequest -Uri $binUrl -OutFile $exePath
          
          Write-Host "Injecting native Windows Host Service definitions..."
          sc.exe create ChromotingHost binPath= "`"$exePath`" --type=daemon" start= auto
          sc.exe description ChromotingHost "Chrome Remote Desktop Service Daemon Link"
          
          Write-Host "Service structural registration successful!"

      - name: Configure and Start CRD Session with Failover Protection
        shell: powershell
        run: |
          try {
              $rawInput = @'
              ${{ github.event.inputs.auth_code }}
              '@.Trim()
              
              $pin = "${{ github.event.inputs.pin_code }}"
              $exePath = "C:\CRD_Service_Engine\remoting_start_host.exe"
              
              $codeParam = ""
              $redirectParam = "https://remotedesktop.google.com/_/oauthredirect"
              
              # FIXED: Corrected PowerShell elseif syntax block cleanly
              if ($rawInput -match '--code="([^"]+)"') { 
                  $codeParam = $Matches[1] 
              }
               Cinderella-elseif ($rawInput -match '--code=([^ ]+)') { 
                  $codeParam = $Matches[1].Trim('"') 
              }
              
              if (-not $codeParam) {
                  throw "Could not parse code parameter from input layout string."
              }
              
              $arguments = @(
                  "--code=`"$codeParam`"",
                  "--redirect-url=`"$redirectParam`"",
                  "--name=`"$env:COMPUTERNAME`"",
                  "--pin=`"$pin`""
              )
              
              Write-Host "Executing Primary Method A: Direct Cloud Registration..."
              $process = Start-Process -FilePath $exePath -ArgumentList $arguments -NoNewWindow -PassThru -Wait
              
              sc.exe start ChromotingHost 2>&1 | Out-Null
              
              if ($process.ExitCode -ne 0) {
                  throw "Primary registration dropped with error code $($process.ExitCode)"
              }
              
              Write-Host "Primary Method A connected successfully!"
          }
          catch {
              Write-Warning "=== METHOD A FAILED: $_ ==="
              Write-Warning "Executing Fallback Method B: Automatic Environment Reconstruction..."
              
              # Clean up failed state to avoid resource conflicts
              sc.exe stop ChromotingHost 2>&1 | Out-Null
              sc.exe delete ChromotingHost 2>&1 | Out-Null
              
              Write-Host "Downloading fallback clean platform installer..."
              $fallbackUrl = "https://google.com"
              $msiPath = "$env:TEMP\fallback_crd.msi"
              Invoke-WebRequest -Uri $fallbackUrl -OutFile $msiPath
              
              Write-Host "Forcing localized raw administrative bypass file layout extraction..."
              $bypassDir = "C:\CRD_Fallback_Extracted"
              Start-Process msiexec.exe -ArgumentList "/a", "`"$msiPath`"", "/qn", "TARGETDIR=`"$bypassDir`"" -Wait
              
              $fallbackExe = "C:\CRD_Fallback_Extracted\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
              if (-not (Test-Path $fallbackExe)) {
                  $fallbackExe = "C:\CRD_Fallback_Extracted\Program Files\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
              }
              
              # Re-parse tokens using fallback direct slicing rules
              $rawInput = @"
              ${{ github.event.inputs.auth_code }}
              "@
              $codeSplit = $rawInput -split '--code='
              $dirtyCode = $codeSplit[1] -split ' '
              $cleanCode = $dirtyCode[0].Trim('"').Trim("'")
              
              $fallbackArgs = "/c `"$fallbackExe`" --code=`"$cleanCode`" --redirect-url=`"https://remotedesktop.google.com/_/oauthredirect`" --name=`"$env:COMPUTERNAME`" --pin=`"$pin`""
              
              Write-Host "Launching fallback service layer loop..."
              Start-Process cmd.exe -ArgumentList $fallbackArgs -NoNewWindow
          }

      - name: Maintain Connection Loop
        shell: powershell
        run: |
          Write-Host "`n=================================================="
          Write-Host "     CHROME REMOTE DESKTOP SYSTEM ONLINE          "
          Write-Host "=================================================="
          Write-Host "Go to: https://google.com"
          Write-Host "Your Device Access PIN is: ${{ github.event.inputs.pin_code }}"
          Write-Host "==================================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Protected by Failover Engine"
              Start-Sleep -Seconds 300
          }
