name: Chrome Remote Desktop RDP

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Paste your entire Chrome Remote Desktop Windows (cmd.exe) string here'
        required: true
      pin_code:
        description: 'Set a temporary 6-digit access PIN'
        required: true
        default: '123456'

jobs:
  crd-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Deploy and Configure Chrome Remote Desktop Environment
        uses: shell-actions/chrome-remote-desktop@v1
        with:
          # Automatically extracts the code parameters and builds the registry structures natively
          crd-code: ${{ github.event.inputs.auth_code }}
          crd-pin: ${{ github.event.inputs.pin_code }}

      - name: Maintain Connection Loop
        shell: powershell
        run: |
          Write-Host "`n=================================================="
          Write-Host "     CHROME REMOTE DESKTOP SYSTEM ONLINE          "
          Write-Host "=================================================="
          Write-Host "Go to: https://google.com"
          Write-Host "Your Device Access PIN is: ${{ github.event.inputs.pin_code }}"
          Write-Host "==================================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Ready for connections via Google Web Dashboard"
              Start-Sleep -Seconds 300
          }
