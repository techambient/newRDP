name: Chrome Remote Desktop RDP

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Paste your entire Chrome Remote Desktop Windows (cmd.exe) string here'
        required: true
      pin_code:
        description: 'Set a temporary 6-digit access PIN'
        required: true
        default: '123456'

jobs:
  crd-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Download and Force Deploy Chrome Remote Desktop
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          
          Write-Host "Downloading Google's secure installation package..."
          $msiUrl = "https://google.com"
          $installerPath = "$env:TEMP\crd.msi"
          Invoke-WebRequest -Uri $msiUrl -OutFile $installerPath
          
          Write-Host "Deploying installer inside an isolated system task session..."
          # Running the MSI using a dedicated background argument script isolates the install thread
          # This breaks any modal windows or update prompts that freeze headless machines
          $scriptBlock = {
              param($path)
              Start-Process msiexec.exe -ArgumentList "/i", "`"$path`"", "/qn", "/norestart", "ALLUSERS=1" -Wait
          }
          
          $job = Start-Job -ScriptBlock $scriptBlock -ArgumentList $installerPath
          Write-Host "Waiting 30 seconds for background execution to commit changes..."
          $job | Wait-Job -Timeout 30 | Receive-Job
          
          # Clean up download residue
          if (Test-Path $installerPath) { Remove-Item $installerPath -Force }

      - name: Configure and Start CRD Session
        shell: powershell
        run: |
          $rawInput = @'
          ${{ github.event.inputs.auth_code }}
          '@.Trim()
          
          $pin = "${{ github.event.inputs.pin_code }}"
          
          # Scan common installation folder configurations dynamically
          $searchPaths = @(
              "C:\Program Files\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe",
              "C:\Program Files (x86)\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe",
              "C:\Program Files\Google\Chrome Remote Desktop\*\remoting_start_host.exe"
          )
          
          $exePath = $null
          foreach ($path in $searchPaths) {
              $resolved = Resolve-Path $path -ErrorAction SilentlyContinue
              if ($resolved) { $exePath = $resolved.Path; break }
          }
          
          if (-not $exePath) {
              Write-Error "CRD executable could not be mapped. Let's force an directory scan to triage..."
              Get-ChildItem -Path "C:\Program Files" -Recurse -Filter "*remoting*" -ErrorAction SilentlyContinue | Select-Object FullName
              exit 1
          }
          
          Write-Host "Target engine isolated at: $exePath"
          
          # Parse parameter arrays safely from your string input parameters
          $codeParam = ""
          $redirectParam = "https://remotedesktop.google.com/_/oauthredirect"
          
          if ($rawInput -match '--code="([^"]+)"') { $codeParam = $Matches[1] }
          elseif ($rawInput -match '--code=([^ ]+)') { $codeParam = $Matches[1].Trim('"') }
          
          if (-not $codeParam) {
              Write-Error "Failed to isolate valid token values from input. Please check configuration command layout."
              exit 1
          }
          
          $arguments = @(
              "--code=`"$codeParam`"",
              "--redirect-url=`"$redirectParam`"",
              "--name=`"$env:COMPUTERNAME`"",
              "--pin=`"$pin`""
          )
          
          Write-Host "Registering machine instance with Google..."
          $process = Start-Process -FilePath $exePath -ArgumentList $arguments -NoNewWindow -PassThru -Wait
          
          if ($process.ExitCode -ne 0) {
              Write-Error "Google infrastructure authorization dropped out with error code: $($process.ExitCode)"
              exit 1
          }

      - name: Maintain Connection Loop
        shell: powershell
        run: |
          Write-Host "`n=================================================="
          Write-Host "     CHROME REMOTE DESKTOP SYSTEM ONLINE          "
          Write-Host "=================================================="
          Write-Host "Go to: https://google.com"
          Write-Host "Your Device Access PIN is: ${{ github.event.inputs.pin_code }}"
          Write-Host "==================================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active - Ready for connections via Google Web Dashboard"
              Start-Sleep -Seconds 300
          }
