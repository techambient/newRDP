name: Chrome Remote Desktop RDP

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Paste your entire Chrome Remote Desktop Windows (cmd.exe) string here'
        required: true
      pin_code:
        description: 'Set a temporary 6-digit access PIN'
        required: true
        default: '123456'

jobs:
  crd-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Download and Install Chrome Remote Desktop
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          
          Write-Host "Downloading Google Remote Desktop installer..."
          $msiUrl = "https://google.com"
          $installerPath = "$env:TEMP\crd.msi"
          $logPath = "$env:TEMP\crd_install.log"
          
          Invoke-WebRequest -Uri $msiUrl -OutFile $installerPath
          
          Write-Host "Installing MSI silently with administrative flags..."
          # Added ALLUSERS=1 to force system-wide registration profile creation
          $arguments = @("/i", "`"$installerPath`"", "/qn", "/norestart", "ALLUSERS=1", "/v`"L*v $logPath`"")
          $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          
          Write-Host "MSI Exit Code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
              if (Test-Path $logPath) { Get-Content $logPath -Tail 20 }
          }
          
          Remove-Item $installerPath -Force
          Write-Host "Waiting 20 seconds for services to settle..."
          Start-Sleep -Seconds 20

      - name: Configure and Start CRD Session
        shell: powershell
        run: |
          $rawInput = @'
          ${{ github.event.inputs.auth_code }}
          '@.Trim()
          
          $pin = "${{ github.event.inputs.pin_code }}"
          
          # Dynamically search directories without hardcoding assumptions
          $searchPaths = @(
              "C:\Program Files\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe",
              "C:\Program Files (x86)\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe",
              "C:\Program Files\Google\Chrome Remote Desktop\*\remoting_start_host.exe",
              "C:\Program Files (x86)\Google\Chrome Remote Desktop\*\remoting_start_host.exe"
          )
          
          $exePath = $null
          foreach ($path in $searchPaths) {
              $resolved = Resolve-Path $path -ErrorAction SilentlyContinue
              if ($resolved) {
                  $exePath = $resolved.Path
                  break
              }
          }
          
          if (-not $exePath) {
              Write-Error "CRD installation folders are missing. Forcing check on local directory contents..."
              Get-ChildItem -Path "C:\Program Files" -Recurse -Filter "*remoting*" -ErrorAction SilentlyContinue
              exit 1
          }
          
          Write-Host "Target identified: $exePath"
          
          # Target standard string split parameters to grab the pure authorization token cleanly
          $codeParam = ""
          $redirectParam = "https://remotedesktop.google.com/_/oauthredirect"
          
          if ($rawInput -match '--code="([^"]+)"') { $codeParam = $Matches[1] }
          elseif ($rawInput -match '--code=([^ ]+)') { $codeParam = $Matches[1].Trim('"') }
          
          if (-not $codeParam) {
              Write-Error "Failed to isolate clean parameter value strings."
              exit 1
          }
          
          $arguments = @(
              "--code=`"$codeParam`"",
              "--redirect-url=`"$redirectParam`"",
              "--name=`"$env:COMPUTERNAME`"",
              "--pin=`"$pin`""
          )
          
          Write-Host "Calling host registration handler..."
          $process = Start-Process -FilePath $exePath -ArgumentList $arguments -NoNewWindow -PassThru -Wait
          
          if ($process.ExitCode -ne 0) {
              Write-Error "Host registration dropped out with error code: $($process.ExitCode)"
              exit 1
          }

      - name: Maintain Connection Loop
        shell: powershell
        run: |
          Write-Host "`n=================================================="
          Write-Host "     CHROME REMOTE DESKTOP SYSTEM ONLINE          "
          Write-Host "=================================================="
          Write-Host "Go to: https://google.com"
          Write-Host "Your Device Access PIN is: ${{ github.event.inputs.pin_code }}"
          Write-Host "==================================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] Session Alive - Ready for connections via Google Web Dashboard"
              Start-Sleep -Seconds 300
          }
